# Proposed only: generator and structural tests; never use as A1-b-exact screen/training input.
name: a1b_scale_structured_v1
status: proposed_generator_and_difficulty_tests_only
suggested_future_seed_range: [4000, 4099]
instance:
  task_range: [8, 10]
  pools: 2
  resource_dims: 2
  exact_integer_ticks: true
pools:
  fast_tight:
    capacity: [7, 7]
    duration_ticks: [1, 3]
  slow_loose:
    capacity: [14, 14]
    duration_multiplier_vs_fast: [2, 3]
constraints:
  fast_pool_key_dimension_demand_ratio: [0.55, 0.85]
  single_pool_task_fraction: [0.35, 0.45]
prohibitions:
  exact_a1b_training: true
  claim_with_wait_equals_without_wait_without_per_instance_proof: true
  screen_or_train_without_new_approval: true
